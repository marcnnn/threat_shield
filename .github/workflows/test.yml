name: Run Tests

# build.yml and deploy_gcp.yml wait for this workflow and run only when all of its
# jobs succeed. The jobs are the tests and the checks of the code (compiler warnings,
# formatting, Credo, Sobelow, Dialyzer, Ash codegen): a push to main that fails one of
# them is not deployed. The dependency audits and the secret scan are in security.yml
# and do not block the deploy (see "Checks" in AGENTS.md).
on:
  push:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  run-tests:
    name: Tests and compiler warnings
    services:
      db:
        image: postgres:18
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: threat_shield
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
        with:
          mix-env: test

      - name: Compile without warnings
        run: mix compile --warnings-as-errors --force

      # mix compile --warnings-as-errors ignores the warnings of dependencies
      - name: Only the known warnings of the library in the app
        run: scripts/check_library_warnings_in_app.sh

      - name: Resources match the migrations
        run: mix ash.codegen --check

      - name: Run tests
        run: mix test

      # The library shares deps/ and mix.lock with the application
      - name: Compile the library without warnings
        working-directory: packages/ash_threat_shield
        run: mix compile --warnings-as-errors --force

      - name: Resources of the library match the migrations of its test host
        working-directory: packages/ash_threat_shield
        run: mix ash.codegen --check

      - name: Run tests of the library ash_threat_shield
        working-directory: packages/ash_threat_shield
        run: mix test

  checks:
    name: Formatting, Credo and Sobelow
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
        with:
          mix-env: dev

      - name: Formatting
        run: mix format --check-formatted

      - name: Formatting of the library
        working-directory: packages/ash_threat_shield
        run: mix format --check-formatted

      - name: No unused dependencies in mix.lock
        run: mix deps.unlock --check-unused

      # Some AshCredo checks read the compiled resources
      - name: Compile
        run: mix compile && (cd packages/ash_threat_shield && mix compile)

      - name: Credo
        run: mix credo --strict

      - name: Credo of the library
        working-directory: packages/ash_threat_shield
        run: mix credo --strict

      - name: Sobelow
        run: mix sobelow

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
        with:
          mix-env: dev

      # The PLTs depend on Erlang, Elixir and the locked dependencies
      - name: Restore the PLTs
        id: plt-cache
        uses: actions/cache/restore@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-otp29.1.1-elixir1.20.4-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-otp29.1.1-elixir1.20.4-

      # The library uses the PLTs of the app (see its mix.exs)
      - name: Build the PLTs
        run: mix dialyzer --plt

      # saved even if Dialyzer finds problems below
      - name: Save the PLTs
        if: steps.plt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: priv/plts
          key: ${{ steps.plt-cache.outputs.cache-primary-key }}

      - name: Dialyzer
        run: mix dialyzer --format github

      - name: Dialyzer of the library
        working-directory: packages/ash_threat_shield
        run: mix dialyzer --format github
