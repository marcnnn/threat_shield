name: Security

# Dependency advisories and secrets. Advisories are published without a change of
# the code, so these checks also run every week, and they do not block the deploy:
# a new advisory must not hold back an unrelated fix. A failed run is reported like
# any failed workflow (see "Checks" in AGENTS.md).
on:
  push:
    branches:
      - "*"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Advisories of Hex and npm dependencies
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
        with:
          mix-env: dev

      # The library shares mix.lock with the app, so these cover it too. Ignored
      # advisories are listed with their reasons in mix.exs.
      - name: mix hex.audit
        run: mix hex.audit

      - name: mix deps.audit (mix_audit)
        run: mix deps.audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit
        working-directory: assets
        run: npm audit --omit=dev

  secrets:
    name: Secrets in the git history (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # Reviewed findings that are not secrets are listed in .gitleaksignore
      - name: Scan the git history
        run: gitleaks git --redact --verbose .
